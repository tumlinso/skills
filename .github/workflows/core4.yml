name: CORE4 software-ready validation

on:
  push:
    paths:
      - "todo-orchestrator/**"
      - "cpp-context-compiler/**"
      - "cuda/**"
      - "local-coding-worker/**"
      - "AGENTS.md"
      - ".gitignore"
      - ".github/workflows/core4.yml"
  pull_request:
    paths:
      - "todo-orchestrator/**"
      - "cpp-context-compiler/**"
      - "cuda/**"
      - "local-coding-worker/**"
      - "AGENTS.md"
      - ".gitignore"
      - ".github/workflows/core4.yml"
  workflow_dispatch:

jobs:
  software-ready:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - name: Validate todo-orchestrator
        run: python3 -m unittest discover -s todo-orchestrator/tests -v
      - name: Validate cpp-context-compiler
        run: python3 -m unittest discover -s cpp-context-compiler/tests -v
      - name: Validate CUDA guidance and tooling
        run: python3 -m unittest discover -s cuda/tests -v
      - name: Validate local-coding-worker
        run: python3 -m unittest discover -s local-coding-worker/tests -v
