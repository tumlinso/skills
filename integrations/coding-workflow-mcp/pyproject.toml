[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "coding-workflow-mcp"
version = "0.3.0"
description = "Temporary compatibility aliases forwarding to Project Control"
requires-python = ">=3.11"
dependencies = ["mcp>=1,<2"]

[project.scripts]
coding-workflow-mcp = "coding_workflow_mcp.__main__:main"
coding-workflow-admin = "coding_workflow_mcp.admin:main"

[tool.setuptools.packages.find]
include = ["coding_workflow_mcp*"]
